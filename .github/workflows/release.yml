name: Release

# Runs only for a `vX.Y.Z` tag the maintainer pushes. The full CI must pass on the tagged commit,
# the build checks the tag against the built version and the changelog, then the files go to PyPI
# through Trusted Publishing (environment `pypi`: no stored token, the environment's reviewer
# approves each upload), and only then is a GitHub Release made with the wheel and the sdist, so a
# refused upload leaves no public release. The wheel carries a compiled tess_utils, so it is a
# platform wheel tagged manylinux_2_36 (hatch_build.py); the CI job `package`, which this workflow
# runs first, checks that tag with `auditwheel show`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CHANGELOG: CHANGELOG.md

jobs:
  ci:
    name: The full CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Check and build
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --out-dir dist
      - name: The tag, the built version and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The sdist is named name-VERSION.tar.gz, which holds for a dynamic version too.
          sdist=$(basename dist/*.tar.gz .tar.gz)
          version=${sdist##*-}
          [ "v$version" = "$TAG" ] || { echo "tag $TAG != built version $version (use the PEP 440 form, v1.2.3rc1)"; exit 1; }
          grep -Eq "^## ${version//./\\.}( |$)" "$CHANGELOG" || { echo "$CHANGELOG has no '## $version' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The wheel imports in a clean environment, as the version it was built as
        run: |
          uv venv --python 3.14 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          # Package metadata, not __version__, is what pip reads.
          cd /tmp && /tmp/smoke/bin/python -I -c "import tess_shell, importlib.metadata as m; from tess_shell._vendor import tess_utils; v = m.version('tesserae-shell'); assert v == '$VERSION', v"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Trusted Publishing: PyPI trusts this repository, this workflow file and this environment
    # (the pending publisher the maintainer set up on 2026-11-15). No token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/tesserae-shell/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The changelog section of this version is the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" && $2 == v {on=1; next} /^## / && on {exit} on' "$CHANGELOG" > notes.md
          test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

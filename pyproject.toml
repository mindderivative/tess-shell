[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae-shell"
dynamic = ["version"]
description = "Tesserae Shell: build desktop shells (bars, panels, docks, launchers, OSDs) from TDL files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Mind Derivative" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "tesserae-engine>=0.6.7,<0.7",
    "tesserae-el>=0.1.2,<0.2",
    "tesserae-dl>=0.1.1,<0.2",
    "loguru>=0.7.3,<0.8",
    "inotify-simple>=2.0.1,<3",
    "dbus-fast>=2.24,<4",
    "pillow>=11,<14",
    "jeepney>=0.9,<0.10",
]

[project.urls]
Repository = "https://github.com/mindderivative/tess-shell"

[project.scripts]
tesserae-shell = "tess_shell.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.version]
path = "src/tess_shell/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tess_shell"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tre: needs a Wayland compositor (started privately with sway)",
    "perf: performance measurement",
    "manual: needs a person",
    "dbus: needs a session bus",
    "compositor: needs the real compositor",
    "audio_sandbox: needs the private PipeWire stack inside the bwrap sandbox (tests/spikes/audio)",
]
addopts = "-m 'not perf and not manual and not compositor and not dbus and not audio_sandbox'"

[tool.ruff]
line-length = 100
extend-exclude = ["tools", "docs", "graphify-out", "src/tess_shell/_vendor"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the checklist generators embed whole TDL files in strings
"tests/kwin/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.uv]
# Stay on the system CPython (3.14.9, with the GIL); uv would otherwise pick the free-threaded build.
python-preference = "only-system"

[[tool.mypy.overrides]]
module = ["inotify_simple", "jeepney", "jeepney.*"]
ignore_missing_imports = true  # no stubs and no py.typed marker
